name: fitness-formulasi

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_formulasi}
      POSTGRES_USER: ${POSTGRES_USER:-ff_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: API in a container. For daily development run the API with `dotnet run` instead.
  api:
    profiles: ["api"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fitness_formulasi};Username=${POSTGRES_USER:-ff_app};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Integrations__EncryptionKey: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      Database__MigrateOnStartup: "true"
      Bootstrap__AdminPhone: ${BOOTSTRAP_ADMIN_PHONE:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: ${ADMIN_ORIGIN:-http://localhost:5173}
      # Banner photos and videos uploaded in the admin panel, and clients' food photos; back up together with the database.
      Media__RootPath: /data/media
      # AI Food Scanner (docs/NUTRITION.md). Without AI_API_KEY photo analysis is off; the diary and barcodes still work.
      Ai__Provider: ${AI_PROVIDER:-None}
      Ai__ApiKey: ${AI_API_KEY:-}
      Ai__VisionModel: ${AI_VISION_MODEL:-claude-opus-5-5}
      Ai__ChatModel: ${AI_CHAT_MODEL:-claude-opus-5-5}
      Ai__MonthlyBudgetUsd: ${AI_MONTHLY_BUDGET_USD:-100}
      FoodData__UsdaApiKey: ${USDA_API_KEY:-}
    volumes:
      - media-data:/data/media
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  postgres-data:
  media-data:
