name: fitness-formulasi

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_formulasi}
      POSTGRES_USER: ${POSTGRES_USER:-ff_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: API in a container. For daily development run the API with `dotnet run` instead.
  api:
    profiles: ["api"]
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fitness_formulasi};Username=${POSTGRES_USER:-ff_app};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Integrations__EncryptionKey: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      Database__MigrateOnStartup: "true"
      Bootstrap__AdminPhone: ${BOOTSTRAP_ADMIN_PHONE:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__AllowedOrigins__0: ${ADMIN_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"

volumes:
  postgres-data:
